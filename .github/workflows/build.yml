name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

env:
  # The NDK common.mk expects (NDK_VERSION); installed side-by-side below so the toolchain path
  # $ANDROID_HOME/ndk/$NDK_VERSION the Makefile builds resolves on the runner.
  NDK_VERSION: "29.0.13113456"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # VER_CODE is `git rev-list HEAD --count`; a shallow clone would report the wrong number.
          fetch-depth: 0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      # The Makefile packages with `zip`, falling back to `7z`; the runner is not guaranteed either,
      # so install zip. python3 (scripts/sign.py) is already on the image.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      # ANDROID_HOME is exported by setup-android; common.mk reads it (ANDROID_HOME ?= ...), so the
      # NDK just installed under it is found. No signing key on CI — scripts/sign.py takes --no-sign.
      - name: Build (debug + release)
        run: make all NDK_VERSION="${NDK_VERSION}"

      - name: List artifacts
        run: ls -la build/out/

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: CaremeZygisk-zips
          path: build/out/*.zip
          if-no-files-found: error

      # A pushed v* tag publishes a release from the same zips this build produced, so cutting a
      # release is `git tag && git push`.
      - name: Publish release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --latest \
            --title "CaremeZygisk ${TAG}" \
            --notes "CaremeOS 8.1 设备专用 Zygisk（Android 8.1 / SDK 27，纯 32 位 armeabi-v7a，ptrace + native-bridge 双路注入；已测 CaremeOS 1.0 & 2.0）。构建自 ${{ github.sha }}。" \
            build/out/*.zip
